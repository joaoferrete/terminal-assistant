# Terminal Assistant — exemplo de configuração do usuário.
#
# Copie para `~/.config/ta/config.toml` (ou `$XDG_CONFIG_HOME/ta/config.toml`).
# `ta doctor` faz isso para você.
#
# Tudo aqui é opcional. Sem este arquivo o projeto funciona: `ta on light.o_que_for`
# continua exato, e `ta on quarto` casa por trecho do nome que vem do próprio Home
# Assistant. Os apelidos são conveniência de digitação, não modelo de domínio.
#
# Segredos NÃO moram aqui — eles vêm do ambiente, via `.env`. Veja `.env.example`.

# ── Apelidos ────────────────────────────────────────────────────────────────
# `ta on quarto` em vez de `ta on light.lampada_do_quarto`.
# Para descobrir os `entity_id` da sua casa: `ta entities`.
[aliases]
# quarto = "light.lampada_do_quarto"
# ventilador = "switch.ventilador_socket_1"

# ── Grupos ──────────────────────────────────────────────────────────────────
# Acrescentados aos embutidos, que já existem e não precisam ser declarados:
#
#     luz, luzes  -> light.
#     tomada(s)   -> switch.
#     tudo        -> light. e switch.
#
# O valor é uma lista de prefixos de domínio. Um nome repetido substitui o embutido.
[groups]
# escritorio = ["light.", "switch."]

# ── Sensores ────────────────────────────────────────────────────────────────
# Quais entity_id alimentam `ta temp` e `ta router`. Sem isto os dois comandos
# não têm o que mostrar, e dizem isso em vez de imprimir brancos.
# Use `ta entities` para descobrir os seus.
[sensors]
# weather = "weather.forecast_home"
# external_ip = "sensor.router_external_ip"
# download = "sensor.router_download_speed"
# upload = "sensor.router_upload_speed"
# outlet = "switch.fan_socket_1"
# watts = "sensor.fan_power"
# volts = "sensor.fan_voltage"
# amps = "sensor.fan_current"
# kwh_total = "sensor.fan_energy_total"
