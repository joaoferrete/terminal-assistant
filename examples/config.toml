# Terminal Assistant — an example user configuration.
#
# Copy it to `~/.config/ta/config.toml` (or `$XDG_CONFIG_HOME/ta/config.toml`).
# `ta doctor` does that for you.
#
# Everything here is optional. The project works with no such file at all:
# `ta on light.whatever` is still exact, and `ta on bedroom` matches by a slice of
# the name that comes from Home Assistant itself. The aliases are a typing
# convenience, not a domain model.
#
# Secrets do NOT live here — they come from the environment, via `.env`. See
# `.env.example`.

# ── Language ────────────────────────────────────────────────────────────────
# `pt` or `en`. It governs the capture parser, the CLI, the board and the
# language the model writes in — all at once (ADR 0013).
#
# Leave it out and the tool reads your system locale, so on a `pt_BR` machine it
# is Portuguese without you configuring anything. `TA_LANG` in the environment
# beats this file; `ta lang en` writes it here for you.
# lang = "en"

# ── Aliases ─────────────────────────────────────────────────────────────────
# `ta on bedroom` instead of `ta on light.bedroom_lamp`.
# To discover your own house's `entity_id`s: `ta entities`.
[aliases]
# bedroom = "light.bedroom_lamp"
# fan = "switch.fan_socket_1"

# ── Groups ──────────────────────────────────────────────────────────────────
# Added to the built-in ones, which already exist and need no declaring:
#
#     luz, luzes  -> light.
#     tomada(s)   -> switch.
#     tudo        -> light. and switch.
#
# Those names stay Portuguese on purpose: they are what you type, the same
# category as `!alta` and `@sexta`, and renaming them would break a command
# somebody already has in their fingers. `light` works as an alias for `luz`.
#
# The value is a list of domain prefixes. A repeated name replaces the built-in.
[groups]
# office = ["light.", "switch."]

# ── Sensors ─────────────────────────────────────────────────────────────────
# Which entity_ids feed `ta temp` and `ta router`. Without this the two commands
# have nothing to show, and they say so instead of printing blanks.
# Use `ta entities` to find yours.
[sensors]
# weather = "weather.forecast_home"
# external_ip = "sensor.router_external_ip"
# download = "sensor.router_download_speed"
# upload = "sensor.router_upload_speed"
# outlet = "switch.fan_socket_1"
# watts = "sensor.fan_power"
# volts = "sensor.fan_voltage"
# amps = "sensor.fan_current"
# kwh_total = "sensor.fan_energy_total"
