[project]
name = "terminal-assistant"
version = "0.1.0"
description = "Assistente pessoal de terminal: casa inteligente e notas, sob um motor de gatilhos"
requires-python = ">=3.12"
readme = "README.md"

# Forma clássica de propósito: a `license = "Apache-2.0"` do PEP 639 exige
# setuptools >= 77, e a venv desta máquina está na 68. Trocar forçaria o pip a
# buscar um setuptools novo no build isolado — mudança de rede num `make install`
# que hoje funciona. Migrar quando a base subir.
license = { text = "Apache-2.0" }
authors = [{ name = "Joao Ferrete" }]
keywords = ["automation", "home-assistant", "notes", "tasks", "cli", "gnome"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Home Automation",
    "Topic :: Office/Business :: Scheduling",
    "Operating System :: POSIX :: Linux",
]

# O teto `<3.13` saiu: ele descrevia o Python do sistema de UMA máquina, não uma
# restrição do código. O núcleo — notas, mural, motor de gatilhos — não importa
# `gi` em lugar nenhum, e a suíte inteira passa com ele bloqueado.
#
# A regra continua valendo onde ela é verdade: se você quer a integração de
# AGENDA, a venv tem que ser criada com o Python do sistema, porque é lá que o
# PyGObject vive. Numa máquina cujo Python de sistema é 3.13, o `gi` está lá para
# o 3.13. Ver docs/adr/0005-the-system-python-because-of-pygobject.md

dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Speech to text for voice notes (F2). Optional: it pulls in CTranslate2 and PyAV,
# which a machine that only types notes does not need.
voice = ["faster-whisper>=1.0"]

[project.scripts]
ta = "ta.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ta = ["web/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
