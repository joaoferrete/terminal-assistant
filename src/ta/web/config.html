<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Assistant</title>
<style>
  :root {
    --bg: #f2f0eb; --fg: #2a2723; --muted: #6f6a61; --line: #d6d2c8;
    --panel: #fbfaf7; --accent: #b4531f; --shadow: rgba(0,0,0,.12);
    --ok: #2e7d32; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --fg: #e8e4dc; --muted: #9a948a; --line: #2c3035;
      --panel: #1d2024; --shadow: rgba(0,0,0,.5); --ok: #81c784; --bad: #ef9a9a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; gap: .8rem; align-items: center; padding: .8rem 1rem;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1 1 auto; }
  header a { color: var(--muted); }
  main { max-width: 52rem; margin: 0 auto; padding: 1rem; }
  section { background: var(--panel); border-radius: 10px; padding: 1rem;
            margin-bottom: 1rem; box-shadow: 0 2px 8px var(--shadow); }
  section h2 { font-size: .95rem; margin: 0 0 .8rem; }
  .row { display: grid; grid-template-columns: minmax(8rem, 14rem) 1fr; gap: .4rem .8rem;
         align-items: start; margin-bottom: .6rem; }
  .row label { font: 13px/1.3 ui-monospace, monospace; color: var(--muted);
               padding-top: .35rem; overflow-wrap: anywhere; }
  .row .restart { color: var(--accent); font-size: .75rem; font-family: system-ui; }
  input, select, textarea { width: 100%; min-width: 0; padding: .4rem .5rem;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--fg); font: inherit; }
  textarea { font: 13px/1.4 ui-monospace, monospace; min-height: 4.5rem; resize: vertical; }
  textarea.table { min-height: 7rem; }
  button { padding: .45rem .9rem; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .secret { display: grid; grid-template-columns: minmax(8rem, 14rem) 7rem 1fr auto;
            gap: .4rem .6rem; align-items: center; margin-bottom: .5rem; }
  .secret .state.on { color: var(--ok); }
  .secret .state.off { color: var(--muted); }
  #notice { margin: 0 0 1rem; padding: .6rem .8rem; border-radius: 7px;
            white-space: pre-line; }
  #notice.error { background: #ffe1dc; color: #7a2018; border: 1px solid var(--bad); }
  #notice.ok { background: #e3f3e4; color: #1f4d22; border: 1px solid var(--ok); }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; }
  #login { max-width: 22rem; margin: 3rem auto; }
  #login form { display: flex; gap: .5rem; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
    .row label { padding-top: 0; }
    .secret { grid-template-columns: 1fr auto; }
    .secret input { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <a href="/board" id="back"></a>
  <button id="restart" hidden></button>
</header>
<main>
  <div id="notice" hidden></div>
  <section id="login" hidden>
    <h2 id="loginTitle"></h2>
    <form id="loginForm">
      <input type="password" id="password" autocomplete="current-password">
      <button class="primary" id="enter"></button>
    </form>
  </section>
  <div id="app" hidden>
    <section><h2 id="hFields"></h2><div id="fields"></div></section>
    <section><h2 id="hTables"></h2><div id="tables"></div></section>
    <section><h2 id="hEnv"></h2><div id="env"></div></section>
    <div class="actions" style="margin-bottom:1rem"><button class="primary" id="save"></button></div>
    <section><h2 id="hSecrets"></h2><div id="secrets"></div></section>
  </div>
</main>
<script>
const I18N = /*__I18N__*/{};
const tr = (key) => I18N[key] ?? key;
const trf = (key, vars) => tr(key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

// Static labels from the catalogue, never written in the markup (AGENTS §1).
const LABELS = { title: "config.title", back: "config.back", restart: "config.restart",
  loginTitle: "config.login", enter: "config.enter", hFields: "config.fields",
  hTables: "config.tables", hEnv: "config.env", hSecrets: "config.secrets",
  save: "config.save" };
Object.entries(LABELS).forEach(([id, key]) => {
  document.getElementById(id).textContent = tr(key);
});
document.getElementById("password").placeholder = tr("config.password");

const $ = (id) => document.getElementById(id);
const notice = (msg, kind = "error") => {
  $("notice").hidden = !msg;
  $("notice").className = kind;
  $("notice").textContent = msg || "";     // textContent: messages come from the server
};

// The board keeps the Owner's token here when it was opened with ?token=…; the
// config routes accept it the same way. A board session cookie needs nothing.
const api = async (method, path, body) => {
  const headers = body ? { "Content-Type": "application/json" } : {};
  const token = localStorage.getItem("ta.token");
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
  let data = {};
  try { data = await r.json(); } catch { /* no body */ }
  if (!r.ok) {
    const err = new Error(data.error || `${method} ${path} → ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return data;
};

let state = null;
const restartNeeded = new Set();

const labelFor = (key, restart) => {
  const label = document.createElement("label");
  label.textContent = key;
  if (restart) {
    const badge = document.createElement("div");
    badge.className = "restart";
    badge.textContent = tr("config.restart_needed");
    label.appendChild(badge);
  }
  return label;
};

const KINDS = {
  "lang": ["choice", ["", "pt", "en"]],
  "llm.default": ["choice", ["", "deepseek", "gemini"]],
  "llm.fallback": ["choice", ["", "deepseek", "gemini"]],
  "chat.bot_personality": ["longtext"], "chat.house_rules": ["longtext"],
  "channel.telegram.groups": ["lines"], "rag.folders": ["lines"],
};

const render = () => {
  const restart = new Set(state.toml.restart);
  const fields = $("fields"); fields.innerHTML = "";
  Object.entries(state.toml.fields).forEach(([key, value]) => {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(labelFor(key, restart.has(key)));
    const [kind, choices] = KINDS[key] || ["text"];
    let input;
    if (kind === "choice") {
      input = document.createElement("select");
      choices.forEach(c => {
        const o = document.createElement("option");
        o.value = c; o.textContent = c || "—";
        input.appendChild(o);
      });
      input.value = value ?? "";
    } else if (kind === "longtext" || kind === "lines") {
      input = document.createElement("textarea");
      input.value = Array.isArray(value) ? value.join("\n") : (value ?? "");
      if (kind === "lines") input.placeholder = tr("config.one_per_line");
    } else {
      input = document.createElement("input");
      input.value = value ?? "";
    }
    input.dataset.field = key;
    input.dataset.kind = kind;
    input.dataset.original = input.value;
    row.appendChild(input);
    fields.appendChild(row);
  });

  const tables = $("tables"); tables.innerHTML = "";
  Object.entries(state.toml.tables).forEach(([name, text]) => {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(labelFor(`[${name}]`, restart.has(name)));
    const ta = document.createElement("textarea");
    ta.className = "table";
    ta.value = text;
    ta.dataset.table = name;
    ta.dataset.original = text;
    ta.spellcheck = false;
    row.appendChild(ta);
    tables.appendChild(row);
  });

  const env = $("env"); env.innerHTML = "";
  Object.entries(state.env.fields).forEach(([key, value]) => {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(labelFor(key, true));
    const input = document.createElement("input");
    input.value = value;
    input.dataset.env = key;
    input.dataset.original = value;
    row.appendChild(input);
    env.appendChild(row);
  });

  const secrets = $("secrets"); secrets.innerHTML = "";
  Object.entries(state.env.secrets).forEach(([key, set]) => {
    const row = document.createElement("div");
    row.className = "secret";
    const name = document.createElement("label");
    name.textContent = key;
    name.style.font = "13px ui-monospace, monospace";
    const st = document.createElement("span");
    st.className = `state ${set ? "on" : "off"}`;
    st.textContent = tr(set ? "config.set" : "config.unset");
    const input = document.createElement("input");
    input.type = "password";
    input.autocomplete = "new-password";
    input.placeholder = tr("config.new_value");
    const btn = document.createElement("button");
    btn.textContent = tr("config.replace");
    btn.addEventListener("click", async () => {
      if (!input.value.trim()) return;
      try {
        await api("POST", "/config/secret", { key, value: input.value });
        input.value = "";
        restartNeeded.add(key);
        notice(trf("config.replaced", { key }), "ok");
        await load();
      } catch (e) { notice(e.message); }
    });
    row.append(name, st, btn, input);
    secrets.appendChild(row);
  });
  $("restart").hidden = restartNeeded.size === 0;
};

const load = async () => {
  try {
    state = await api("GET", "/config/state");
  } catch (e) {
    if (e.status === 401) {
      // Not an error the first time: it is simply the login. Shown in red, it
      // looked like something had failed before anyone typed anything.
      $("login").hidden = false; $("app").hidden = true;
      return;
    }
    notice(e.message);
    return;
  }
  $("login").hidden = true; $("app").hidden = false;
  render();
};

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("POST", "/config/login", { password: $("password").value });
    $("password").value = "";
    notice(null);
    await load();
  } catch (err) { notice(err.message); }
});

// Only what changed is sent: an untouched field must not rewrite its line.
$("save").addEventListener("click", async () => {
  const body = { fields: {}, tables: {}, env: {} };
  const restart = new Set(state.toml.restart);
  document.querySelectorAll("[data-field]").forEach(el => {
    if (el.value === el.dataset.original) return;
    body.fields[el.dataset.field] = el.dataset.kind === "lines"
      ? el.value.split("\n").map(s => s.trim()).filter(Boolean) : el.value;
    if (restart.has(el.dataset.field)) restartNeeded.add(el.dataset.field);
  });
  document.querySelectorAll("[data-table]").forEach(el => {
    if (el.value === el.dataset.original) return;
    body.tables[el.dataset.table] = el.value;
    if (restart.has(el.dataset.table)) restartNeeded.add(el.dataset.table);
  });
  document.querySelectorAll("[data-env]").forEach(el => {
    if (el.value === el.dataset.original) return;
    body.env[el.dataset.env] = el.value;
    restartNeeded.add(el.dataset.env);
  });
  if (!Object.keys(body.fields).length && !Object.keys(body.tables).length
      && !Object.keys(body.env).length) {
    notice(tr("config.nothing_changed"), "ok");
    return;
  }
  try {
    await api("POST", "/config/save", body);
    notice(tr("config.saved"), "ok");
    await load();
  } catch (e) { notice(e.message); }
});

// Two clicks, like deleting on the board: `confirm()` blocks the page and cannot
// be tested, and a restart drops every open connection for a few seconds.
let armed = false;
$("restart").addEventListener("click", async () => {
  if (!armed) {
    armed = true;
    $("restart").textContent = tr("config.restart_confirm");
    setTimeout(() => { armed = false; $("restart").textContent = tr("config.restart"); }, 4000);
    return;
  }
  try {
    await api("POST", "/config/restart");
    notice(tr("config.restarting"), "ok");
    restartNeeded.clear();
    $("restart").hidden = true;
    setTimeout(load, 6000);
  } catch (e) { notice(e.message); }
});

load();
</script>
</body>
</html>
