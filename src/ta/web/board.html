<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Assistant</title>
<style>
  :root {
    --bg: #f2f0eb; --grid: #e3e0d8; --fg: #2a2723; --muted: #6f6a61;
    --line: #d6d2c8; --panel: #fbfaf7; --accent: #b4531f; --shadow: rgba(0,0,0,.16);
    --col: #eae7e0; --ink: #2a2723;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181b; --grid: #1d2024; --fg: #e8e4dc; --muted: #9a948a;
      --line: #2c3035; --panel: #1d2024; --shadow: rgba(0,0,0,.5); --col: #1b1e22;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body.view-board {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* ── Header ──────────────────────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
    padding: .6rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 650; flex: 0 0 auto; }
  /* flex:0 0 auto + nowrap: without it the input grows and clips what follows. */
  header .count, header .hint { flex: 0 0 auto; white-space: nowrap; color: var(--muted); font-size: .85rem; }
  header .count { font-variant-numeric: tabular-nums; }
  #capture {
    flex: 1 1 12rem; min-width: 0; padding: .45rem .7rem;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 7px; font: inherit;
  }
  #capture:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .views { display: flex; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .views button {
    border: 0; background: transparent; color: var(--muted);
    padding: .4rem .7rem; font: inherit; font-size: .85rem; cursor: pointer;
  }
  .views button + button { border-left: 1px solid var(--line); }
  /* Shrink before pushing the counter out: with three selectors the header
     started overflowing at around 1200px, and the counter was the first thing
     clipped. `min-width: 0` is what allows the shrinking. */
  .filters { display: flex; gap: .3rem; flex: 0 1 auto; min-width: 0; }
  .filters select {
    font: inherit; font-size: .8rem; padding: .28rem .4rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    min-width: 0; max-width: 9rem;
  }
  /* An active filter stays visible: without this, "there are no notes" and "the
     filter is hiding everything" are indistinguishable — and the second is the
     alarming one. */
  .filters select.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,0,0,.06); }
  .action {
    font: inherit; font-size: .8rem; padding: .3rem .55rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    cursor: pointer; flex: 0 0 auto; white-space: nowrap;
  }
  /* The "confirm?" state: red, because the action costs model calls and rewrites
     every tag. The second click is the one that executes. */
  .action[data-armed="1"] { border-color: #c0392b; color: #c0392b; font-weight: 650; }
  .action:disabled { opacity: .55; cursor: default; }
  /* Only exists in the trash, and it is the only action with no undo: it is born
     red rather than turning red only when armed. */
  .action.danger { border-color: #c0392b; color: #ffc4bb; background: transparent; }
  .action.danger[data-armed="1"] { background: #c0392b; color: #fff; font-weight: 700; }
  .views button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* ── Post-it (shared by all three views) ─────────────────────────────── */
  .note {
    background: var(--note-bg, #ffe9a8); color: var(--ink);
    border-radius: 3px; box-shadow: 0 3px 10px var(--shadow);
    /* The bottom padding reserves room for the bar, which is absolute and can
       now take two lines. Without it, it would sit on top of the text. */
    padding: .7rem .8rem 3.1rem; position: relative;
  }
  .note .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .note .meta { margin-top: .4rem; font-size: .74rem; color: #6b5f3e; display: flex; flex-wrap: wrap; gap: .3rem; }
  .note .meta span { background: rgba(0,0,0,.07); padding: .05rem .35rem; border-radius: 3px; }
  .note .meta .overdue { background: #c0392b; color: #fff; }
  .note.terminal { opacity: .55; }
  .note.st-done .text { text-decoration: line-through; }
  .note.st-cancelled .text { text-decoration: line-through; text-decoration-style: wavy; }

  /* `flex-wrap` is mandatory here: the status selector alone eats 110 of the
     222px available, and the bar's content needed 260px. Without wrapping, the
     excess ESCAPED the card — the bar is `absolute` with fixed `left`/`right`, so
     it does not clip, it overflows. First the `#id`, and after the `×` moved to
     the end, the delete button itself. */
  .note .bar {
    position: absolute; left: .55rem; right: .55rem; bottom: .45rem;
    display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; row-gap: .25rem;
  }
  .note button, .note select {
    border: 0; background: rgba(0,0,0,.09); color: var(--ink);
    border-radius: 4px; cursor: pointer; font: inherit; font-size: .74rem; padding: .1rem .3rem;
  }
  .note button:hover { background: rgba(0,0,0,.18); }
  /* nowrap: the palette is one visual unit, and splitting it in half confuses. */
  .note .colours { display: flex; align-items: center; gap: .3rem; flex: 0 0 auto; flex-wrap: nowrap; }
  .swatch { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); padding: 0; }
  .swatch.auto { font-size: 8px; line-height: 1; font-weight: 700; color: rgba(0,0,0,.5);
                 border-style: dashed; margin-right: .15rem; }
  /* The active colour is the post-it's own, so its swatch vanishes into it. */
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px rgba(0,0,0,.55); }
  .note .id { margin-left: auto; color: #6b5f3e; font-size: .7rem; flex: 0 0 auto; }
  .note .del {
    border: 0; background: transparent; color: #6b5f3e; cursor: pointer;
    font-size: .95rem; line-height: 1; padding: 0 .2rem; opacity: .45;
    margin-left: .3rem; flex: 0 0 auto;
  }
  .note .del:hover { opacity: 1; color: #c0392b; }
  /* Armed: red and legible, because the next click really does delete. */
  .note .del[data-armed="1"] {
    opacity: 1; color: #c0392b; font-weight: 700; font-size: .7rem;
    border: 1px solid #c0392b; border-radius: 5px; padding: .1rem .25rem;
  }
  /* A band at the top makes it obvious this is not the normal board — without
     it, the trash looks like an empty board and alarms people. The light tones
     here are mandatory: in the first version the title was dark on dark and
     vanished. */
  body.trash header { background: #4a3b3b; }
  body.trash header h1 { color: #ffe9e4; }
  /* The suffix is written by `draw`, not by `content:` — a literal here would be a
     string the catalogue does not reach, and it said "· trash" under `TA_LANG=pt`. */
  body.trash header h1 .suffix { color: #ffb4a8; font-weight: 400; }
  body.trash header .count { color: #d8c4c0; }
  /* Restore is this screen's main action, so it is not hidden the way the `×` is
     on the board. */
  body.trash .note .del { opacity: 1; font-size: 1.05rem; font-weight: 700; }
  body.trash .note .del:hover { color: #1e7a3c; }

  /* ── Free-form view: arbitrary position ──────────────────────────────── */
  #board.board { position: relative; min-height: calc(100vh - 4rem); padding: 1rem; }
  #board.board .note { position: absolute; width: 15rem; min-height: 6.6rem; cursor: grab; transform: rotate(var(--tilt, -.4deg)); transition: box-shadow .15s, transform .15s; }
  #board.board .note:hover { box-shadow: 0 6px 18px var(--shadow); }
  #board.board .note.dragging { cursor: grabbing; z-index: 50; transform: rotate(0) scale(1.02); }

  /* ── List view ───────────────────────────────────────────────────────── */
  #board.list { display: flex; flex-direction: column; gap: .5rem; padding: 1rem; max-width: 56rem; margin: 0 auto; }
  /* Explicit position for all three children: leaving any of them to
     auto-placement drops the bar into column 1 and pushes the text down. */
  #board.list .note { padding: .55rem .7rem; display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem; }
  #board.list .note .text { grid-column: 1; grid-row: 1; }
  #board.list .note .meta { grid-column: 1; grid-row: 2; margin-top: 0; }
  #board.list .note .bar {
    position: static; left: auto; right: auto; bottom: auto;
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
  }
  /* Priority as a coloured edge, not as text. The first version used vertical
     writing-mode and came out an illegible three-letter smudge — and a redundant
     one, because priority already shows up as a chip in the meta row. */
  #board.list .note { border-left: 4px solid var(--prio-color, transparent); }
  #board.list .note.p-high  { --prio-color: #c0392b; }
  #board.list .note.p-medium { --prio-color: #d68910; }
  #board.list .note.p-low   { --prio-color: #7f8c8d; }
  #board.list .divider { color: var(--muted); font-size: .8rem; padding: .6rem 0 .1rem; border-top: 1px solid var(--line); }

  /* ── Kanban view ─────────────────────────────────────────────────────── */
  #board.kanban { display: flex; gap: .75rem; padding: 1rem; overflow-x: auto; align-items: flex-start; }
  .col {
    flex: 0 0 17rem; background: var(--col); border: 1px solid var(--line);
    border-radius: 9px; padding: .6rem; min-height: 8rem;
  }
  .col.over { outline: 2px dashed var(--accent); outline-offset: -3px; }
  .col h2 { font-size: .8rem; margin: 0 0 .5rem; color: var(--muted); font-weight: 650; display: flex; justify-content: space-between; }
  .col .stack { display: flex; flex-direction: column; gap: .5rem; min-height: 3rem; }
  .col .note { cursor: grab; touch-action: none; }  /* touch-action: the browser must not scroll mid-drag */
  .col .note.dragging { cursor: grabbing; box-shadow: 0 10px 26px var(--shadow); transform: scale(1.02); }

  .empty { color: var(--muted); padding: 2rem 1rem; }
  .erro {
    margin: .6rem 1rem; padding: .6rem .8rem; border-radius: 7px;
    background: #ffe1dc; color: #7a2018; border: 1px solid #c0392b;
    font-size: .85rem; white-space: pre-line;
  }

  @media (max-width: 720px) {
    /* Free positioning is hostile on a phone: the free-form view falls to flow. */
    #board.board { display: flex; flex-direction: column; gap: .8rem; }
    #board.board .note { position: static !important; width: auto; cursor: default; transform: none; }
  }
</style>
</head>
<body class="view-board">
<header>
  <h1 id="boardTitle"></h1>
  <div class="views" id="views">
    <button data-view="board"></button>
    <button data-view="list"></button>
    <button data-view="kanban"></button>
  </div>
  <div class="filters">
    <select id="fArea" data-i18n-title="board.title_filter_area">
      <option value="" data-i18n="board.filter.area"></option>
      <!-- The labels are the stored values, marked with `#` the way the tag
           selector does: the tag vocabulary is canonical Portuguese (the chip on
           the note reads `#trabalho` in any language), so translating them only
           here would make the filter disagree with what the note shows. -->
      <option value="trabalho">#trabalho</option>
      <option value="pessoal">#pessoal</option>
    </select>
    <select id="fType" data-i18n-title="board.title_filter_type">
      <option value="" data-i18n="board.filter.type"></option>
      <option value="tarefa">#tarefa</option>
      <option value="compromisso">#compromisso</option>
      <option value="anotacao">#anotacao</option>
    </select>
    <select id="fTag" data-i18n-title="board.title_filter_tag">
      <option value="" data-i18n="board.filter.tag"></option>
    </select>
  </div>
  <input id="capture">
  <button id="review" class="action" data-i18n-title="board.title_review"></button>
  <button id="emptyTrash" class="action danger" hidden
    data-i18n-title="board.title_empty_trash"></button>
  <span class="count" id="count"></span>
  <label class="hint" id="doneToggle"><input type="checkbox" id="showDone"> <span id="doneLabel"></span></label>
</header>

<!-- Outside `#board` on purpose: in the free-form view the post-its are
     `position: absolute` inside it and would cover the notice. -->
<div id="notice" class="error" hidden></div>

<div id="board" class="board"><div class="empty" data-i18n="board.loading"></div></div>

<script>
// A hand-picked palette drawn from the SAME system as the automatic colours, so
// a colour you chose does not look like it came from another app. Checked in
// CIELAB: the smallest distance between any two is DeltaE 10 — the slate/lilac
// pair sat at 6.3, and slate is the one that left.
const PALETTE = [
  "#ffe7a1",  // amber
  "#ffc5b3",  // salmon
  "#fbc1c4",  // pink
  "#d3ead8",  // mint
  "#dcd8f0",  // lilac
  "#efefe6",  // neutral
];

// The default colour per priority. Pastels on purpose: the post-it has dark ink,
// and the strong edge tones of the list view (#c0392b and friends) would make
// the text illegible as a background.
const PRIO_BG = { high: "#ffc4bb", medium: "#ffe9a8", low: "#ccd9e0" };

// The colour per area, for when there is neither a priority nor a chosen
// colour. Hues well away from the priority ones (red / amber / slate) so the two
// axes do not blur together: this one says "which area", that one says "how
// urgent".
//
// The TAG NAMES stay in Portuguese here because they are stored values — the
// same category as `!alta` and `@sexta`. Translating them would stop matching
// the tags already in anybody's database.
const AREA_BG = { trabalho: "#dcd8f0", pessoal: "#d3ead8" };
const NEUTRAL_BG = "#efefe6";   // neutral paper: nothing to say about area or urgency

const AREAS = ["trabalho", "pessoal"];
const TYPES = ["tarefa", "compromisso", "anotacao"];
const AXIS_TAGS = [...AREAS, ...TYPES];

const areaOf = (n) => (n.tags || []).find(t => AREAS.includes(t)) || null;

// Priority x area. Priority picks the family (red / amber / slate) and the area
// shifts the tone within it: work pulls cold, personal pulls warm.
//
// The six values are fixed and measured, not derived at runtime. The first
// version mixed the area colour into the priority colour with a single weight,
// and it did not work: the three bases have very different saturations, so the
// same weight was imperceptible on slate (DeltaE 5.8) and overblown on amber
// (DeltaE 16 from its own base). Rotating the hue had the opposite problem.
// These pairs were chosen and checked in CIELAB to sit between DeltaE 8 and 11
// from each other — visible side by side, without stopping being the same
// priority.
const PRIO_AREA_BG = {
  high:   { trabalho: "#fbc1c4", pessoal: "#ffc5b3" },
  medium: { trabalho: "#f6e8b0", pessoal: "#ffe7a1" },
  low:    { trabalho: "#cfd5e4", pessoal: "#cadddb" },
};

/** The colour the note shows, in decreasing order of precedence:
 *
 *  1. whatever your hand chose
 *  2. priority, with the **tone shifted by the area** — priority picks the
 *     family (red/amber/slate), area shifts the tone within it. That is what
 *     lets you see both axes in one colour instead of one hiding the other.
 *  3. area alone, when there is no priority (the case of plain notes)
 *  4. neutral paper
 */
const colourOf = (n) => {
  if (n.color) return n.color;
  const area = areaOf(n);
  if (n.priority) {
    const byArea = PRIO_AREA_BG[n.priority];
    return (area && byArea?.[area]) || PRIO_BG[n.priority];
  }
  return AREA_BG[area] || NEUTRAL_BG;
};
const STATUSES = ["todo", "doing", "hold", "done", "cancelled"];
// The catalogue injected by the board route (`I18N_MARKER` in daemon.py). The
// language does not change during the life of the page, so it arrives in the
// HTML rather than in a second request — which would only add latency and a
// moment spent drawing raw keys.
//
// No parallel table here: if a key is missing, `tr` returns the key itself,
// which is ugly and visible, instead of `undefined`, which goes unnoticed.
const I18N = /*__I18N__*/{};
const tr = (key) => I18N[key] ?? key;

/** `tr` plus `{name}` substitution, for the messages that carry a number. */
const trf = (key, vars) => tr(key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

// The static labels are filled in here rather than written into the HTML: the
// catalogue only exists after this line, and fixed text in the markup would be a
// second translation — exactly what this file cannot have.
//
// Runs once, before the first render. If a key is missing, `tr` returns the key
// itself: ugly and visible, instead of empty and silent.
(() => {
  document.getElementById("doneLabel").textContent = tr("board.done");
  document.getElementById("review").textContent = tr("board.review");
  document.getElementById("emptyTrash").textContent = tr("board.empty_trash");
  document.querySelectorAll("button[data-view]").forEach(b => {
    b.textContent = tr(`board.view.${b.dataset.view}`);
  });
  document.querySelectorAll("[data-i18n]").forEach(e => {
    e.textContent = tr(e.dataset.i18n);
  });
  // `aria-label` comes from the same key as the title, and is never written in
  // the markup: a hardcoded label would be a second translation, and the three
  // filter selects show only an icon-sized summary of their own state.
  document.querySelectorAll("[data-i18n-title]").forEach(e => {
    e.title = tr(e.dataset.i18nTitle);
    if (!e.getAttribute("aria-label")) e.setAttribute("aria-label", e.title);
  });
  document.getElementById("capture").placeholder = tr("board.capture");
})();

const LABEL = Object.fromEntries(
  ["todo", "doing", "hold", "done", "cancelled"].map(s => [s, tr(`status.${s}`)])
);
// The horizon bands, with the label the list divider shows. This is the ONLY
// place in the board that knows anything about horizon: the order and the band of
// each note arrive ready from the server, in `n.horizon` (ADR 0010). No date
// arithmetic here — a second definition of "the next 7 days" would be a
// definition no test compares against the Python one.
//
// "later and undated" tells the truth: the band lumps the distant future in with
// whatever has no date at all, so a `!high` note with no deadline does not sink
// below a `!low` one due in September.
const HORIZON_LABEL = Object.fromEntries(
  ["overdue", "today", "week", "later"].map(h => [h, tr(`horizon.${h}`)])
);

const boardEl = document.getElementById("board");
const boardTitleEl = document.getElementById("boardTitle");
const noticeEl = document.getElementById("notice");
const capture = document.getElementById("capture");
const showDone = document.getElementById("showDone");
const doneToggle = document.getElementById("doneToggle");
const countEl = document.getElementById("count");
const viewsEl = document.getElementById("views");
const fArea = document.getElementById("fArea");
const fType = document.getElementById("fType");
const fTag = document.getElementById("fTag");
const btnReview = document.getElementById("review");
const btnEmptyTrash = document.getElementById("emptyTrash");

// The view survives a reload — always coming back to the free-form one would be
// annoying — and the stored value is VALIDATED before it counts.
//
// The views used to be called `geral` and `lista`; anybody who opened the board
// before the rename has one of those in `localStorage`, and a `|| "board"` would
// not catch it, because an old string is truthy. The result would be
// `renderers["geral"]` undefined: a blank board with no visible error, for
// exactly the people who already used it.
const VIEWS = ["board", "list", "kanban"];
let view = VIEWS.includes(localStorage.getItem("ta.view"))
  ? localStorage.getItem("ta.view")
  : "board";

// The trash: reached by `#trash` in the URL, not by a button. Hidden on purpose —
// it is a recovery screen, not part of the daily flow, and a permanent "see what
// I deleted" button would only take up header space.
let trash = location.hash === "#trash";
window.addEventListener("hashchange", () => {
  trash = location.hash === "#trash";
  load();
});
let allNotes = [];   // what came from the API
let notes = [];      // what the renderers draw: `allNotes`, filtered
let staleDaemon = false;   // Python routes older than this HTML (see `load`)
// The `localStorage` KEYS keep their Portuguese names: they are stored state, and
// renaming them would silently drop the filters somebody left set.
let fAreaV = localStorage.getItem("ta.filtro.eixo") || "";
let fTypeV = localStorage.getItem("ta.filtro.tipo") || "";
let fTagV = localStorage.getItem("ta.filtro.tag") || "";

// This HTML can be newer than the daemon serving it: the board is served
// `no-store` and updates immediately, but the Python routes only after a restart.
// One single message, so the two detections (a route that does not exist and a
// field that does not exist) never drift apart.
const MSG_OUTDATED = tr("daemon.outdated");

/** Show the notice above the board, or hide it with `null`.
 *
 * `textContent`, never `innerHTML`: some of these messages come from the server.
 * `.error` has `white-space: pre-line`, so the `\n` breaks the line by itself.
 */
const warn = (msg) => {
  noticeEl.hidden = !msg;
  noticeEl.textContent = msg || "";
};

// ── Credential ─────────────────────────────────────────────────────────────
// Only exists when the daemon was opened beyond loopback (ADR 0012). Opened that
// way, the board is reached at `http://<ip>:7777/board?token=…`: the token comes
// ONCE in the URL, is stored, and leaves the address bar in the same instant —
// otherwise it stays in the browser history and in every link you share.
//
// In local use there is no token at all and none of this runs.
const TOKEN_KEY = "ta.token";
(() => {
  const u = new URL(location.href);
  const t = u.searchParams.get("token");
  if (!t) return;
  localStorage.setItem(TOKEN_KEY, t);
  u.searchParams.delete("token");
  history.replaceState(null, "", u.pathname + u.search + u.hash);
})();

const api = async (method, path, body) => {
  const headers = body ? { "Content-Type": "application/json" } : {};
  const token = localStorage.getItem(TOKEN_KEY);
  if (token) headers["Authorization"] = `Bearer ${token}`;

  const r = await fetch(path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : null,
  });
  if (!r.ok) {
    // 401: the stored token no longer works, or there never was one. Dropping
    // the old value avoids looping forever with the wrong credential.
    if (r.status === 401) {
      localStorage.removeItem(TOKEN_KEY);
      throw new Error(
        tr("auth.board")
      );
    }
    // A 404 on a route this HTML knows about means an old daemon. It really
    // happened — the empty-trash button shipped before the endpoint existed, and
    // "failed" said nothing.
    if (r.status === 404) {
      throw new Error(`${path} → 404.\n${MSG_OUTDATED}`);
    }
    // The server's message, when there is one: it is written to be read.
    let detail = "";
    try { detail = (await r.json()).error || ""; } catch { /* no JSON body */ }
    throw new Error(detail || `${method} ${path} → ${r.status}`);
  }
  return r.json();
};

// The list and the kanban need the terminal notes: the list shows them at the
// end, and the kanban has columns for them. Only the free-form view obeys the
// checkbox.
const wantsAll = () => view !== "board" || showDone.checked;

const load = async () => {
  const q = trash ? "?deleted=1" : (wantsAll() ? "?done=1" : "");
  allNotes = (await api("GET", `/notes${q}`)).notes;
  // The order of the notes comes from the server (ADR 0010). Against an old
  // daemon it arrives raw from `sort_key`, and the board would have no way to
  // know: it would draw the wrong order looking exactly like the right one — the
  // worst possible failure here, because it looks as if the change did not work.
  // `horizon` is the field that proves the version; without it, nothing on screen
  // is sorted. It really happened, and that is why this guard exists.
  //
  // With zero notes there is nothing to check, and no wrong order to show either.
  staleDaemon = allNotes.length > 0 && !("horizon" in allNotes[0]);
  applyFilters();
  render();
};

const metaHTML = (n) => {
  const bits = [];
  if (n.roles.task) {
    // The band comes from the server, so "overdue" and "today" do not depend on
    // the browser clock agreeing with the daemon's.
    const late = n.horizon === "overdue" && !n.terminal;
    const when = n.horizon === "today" && !n.terminal ? tr("horizon.today") : n.due;
    bits.push(`<span class="${late ? "overdue" : ""}">${late ? tr("board.overdue") : tr("board.due")}${when}</span>`);
  }
  if (n.roles.reminder) bits.push(`<span>${tr("board.reminds")}${n.remind_at.slice(5, 16).replace("T", " ")}</span>`);
  if (n.priority) bits.push(`<span>${n.priority}</span>`);
  if (view !== "kanban" && n.status !== "todo") bits.push(`<span>${LABEL[n.status]}</span>`);
  n.tags.forEach(t => bits.push(`<span>#${t}</span>`));
  return bits.length ? `<div class="meta">${bits.join("")}</div>` : "";
};

/** Build a post-it element. The options decide what goes in the bottom bar. */
const noteEl = (n, { withStatusSelect = false, withSwatches = true } = {}) => {
  const el = document.createElement("div");
  el.className = `note st-${n.status}`
    + (n.terminal ? " terminal" : "")
    + (n.priority ? ` p-${n.priority}` : "");
  el.dataset.id = n.id;
  el.dataset.status = n.status;
  el.style.setProperty("--note-bg", colourOf(n));
  el.style.setProperty("--tilt", ((n.id * 37) % 15 - 7) / 10 + "deg");

  const select = withStatusSelect
    ? `<select class="st" title="${tr('board.title_status')}">${STATUSES.map(s =>
        `<option value="${s}"${s === n.status ? " selected" : ""}>${LABEL[s]}</option>`).join("")}</select>`
    : "";
  // The "auto" button clears the manual colour and hands the note back to the
  // priority default. Without it, one stray click would pin a colour forever.
  const auto = `<button class="swatch auto" data-color="" title="${tr('board.title_auto_color')}"
      style="background:${colourOf({ ...n, color: null })}"
      aria-pressed="${!n.color}">A</button>`;
  // The swatches go in a group that does not wrap internally: without this the
  // bar broke mid-palette and left one orphan swatch on the second line.
  const swatches = withSwatches
    ? `<span class="colours">` + auto
      + PALETTE.map(c => `<button class="swatch" data-color="${c}" style="background:${c}" title="${c}"
        aria-pressed="${n.color === c}"></button>`).join("")
      + `</span>`
    : "";

  // `×` to delete, or `↩` in the trash. Last item in the bar, after the number:
  // it is the corner furthest from the text and the status selector, and deleting
  // by accident is the risk this position exists to reduce.
  const action = trash
    ? `<button class="del" title="${tr("board.restore")}" data-restore="1">↩</button>`
    : `<button class="del" title="${tr('board.title_delete')}">×</button>`;

  el.innerHTML = `
    <div class="text"></div>
    ${metaHTML(n)}
    <div class="bar">${select}${swatches}<span class="id">#${n.id}</span>${action}</div>`;
  // textContent, never innerHTML: the note's text is user input.
  el.querySelector(".text").textContent = n.text;

  const del = el.querySelector(".del");
  if (del) {
    // Restoring is harmless and goes straight through. Deleting asks for two
    // clicks: the first swaps the `×` for `delete?` and reverts on its own after
    // 4s. Same choice as "review all" — no `confirm()`, which freezes the page
    // and cannot be tested.
    let armedUntil = 0;
    const disarm = () => {
      del.dataset.armed = "0";
      del.textContent = "×";
      del.title = tr("board.title_delete");
      armedUntil = 0;
    };

    del.onclick = async (e) => {
      e.stopPropagation();
      if (del.dataset.restore) {
        await api("POST", `/notes/${n.id}/restore`);
        await load();
        return;
      }
      if (Date.now() > armedUntil) {
        del.dataset.armed = "1";
        del.textContent = tr("board.delete");
        del.title = tr("board.title_delete_again");
        armedUntil = Date.now() + 4000;
        setTimeout(() => { if (Date.now() > armedUntil) disarm(); }, 4050);
        return;
      }
      await api("DELETE", `/notes/${n.id}`);
      await load();
    };
    del.onpointerdown = (e) => e.stopPropagation();   // does not drag
  }

  el.querySelectorAll(".swatch").forEach(s => {
    s.onclick = async (e) => {
      e.stopPropagation();
      await api("POST", `/notes/${n.id}/move`, { color: s.dataset.color });  // "" = automatic
      await load();
    };
  });
  const sel = el.querySelector(".st");
  if (sel) {
    sel.onchange = async (e) => {
      e.stopPropagation();
      await api("POST", `/notes/${n.id}/status`, { status: sel.value });
      await load();
    };
    sel.onpointerdown = (e) => e.stopPropagation();  // using the select does not drag
  }
  return el;
};

// ── Free-form view ─────────────────────────────────────────────────────────
const fallbackPos = (i) => {
  const perRow = Math.max(1, Math.floor((boardEl.clientWidth - 32) / 272));
  return { x: 16 + (i % perRow) * 272, y: 16 + Math.floor(i / perRow) * 170 };
};

const renderBoard = () => {
  notes.forEach((n, i) => {
    const el = noteEl(n, { withStatusSelect: true });
    const p = n.pos ? { x: n.pos[0], y: n.pos[1] } : fallbackPos(i);
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    makeDraggable(el, n);
    boardEl.appendChild(el);
  });
};

const makeDraggable = (el, n) => {
  el.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest("button, select")) return;
    if (window.matchMedia("(max-width: 720px)").matches) return;
    ev.preventDefault();
    const rect = el.getBoundingClientRect(), boardRect = boardEl.getBoundingClientRect();
    const dx = ev.clientX - rect.left, dy = ev.clientY - rect.top;
    el.setPointerCapture(ev.pointerId);
    el.classList.add("dragging");
    const move = (e) => {
      el.style.left = Math.max(0, e.clientX - boardRect.left - dx) + "px";
      el.style.top = Math.max(0, e.clientY - boardRect.top - dy) + "px";
    };
    const up = async () => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      el.classList.remove("dragging");
      // Persisting here is what makes the user's hand beat the LLM (ADR 0003).
      await api("POST", `/notes/${n.id}/move`, {
        pos_x: Math.round(parseFloat(el.style.left)),
        pos_y: Math.round(parseFloat(el.style.top)),
      });
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
  });
};

// ── List view ──────────────────────────────────────────────────────────────
// There is no sort here: `notes` arrives from the server already in display
// order, and the list only draws the dividers that explain that order (ADR 0010).
// Reordering again on the client would be the same rule written twice.
const divider = (text) => {
  const d = document.createElement("div");
  d.className = "divider";
  d.textContent = text;
  boardEl.appendChild(d);
};

const renderList = () => {
  let band = null;
  let outOfQueueDrawn = false;
  notes.forEach(n => {
    if (n.terminal) {
      // From here on there is no more splitting by band: "out of the queue"
      // followed by "today" means nothing — a finished note has no urgency.
      if (!outOfQueueDrawn) {
        outOfQueueDrawn = true;
        divider(tr("board.out_of_queue"));
      }
    } else if (n.horizon !== band) {
      band = n.horizon;
      // With no band (an old daemon, see `load`) no divider is drawn at all: a
      // rule with no label explains no order, and the notice at the top already
      // says what is going on.
      if (band) divider(HORIZON_LABEL[band] || band);
    }
    boardEl.appendChild(noteEl(n, { withStatusSelect: true, withSwatches: false }));
  });
};

// ── Kanban view ────────────────────────────────────────────────────────────
// Dragging between columns uses pointer events, NOT the HTML5 drag-and-drop API.
// Two reasons: the HTML5 one does not work on touch at all, and the board has to
// work on a phone; and it requires the browser's native gesture, which makes it
// untestable by automation.
const renderKanban = () => {
  const byStatus = Object.fromEntries(STATUSES.map(s => [s, []]));
  // Distributing while preserving the order of `notes` gives urgency order
  // within each column for free. No dividers: the column is 17rem wide, and four
  // labels in there would cost more than they say — the order plus the red
  // "overdue" badge is enough.
  notes.forEach(n => byStatus[n.status]?.push(n));

  STATUSES.forEach(status => {
    const col = document.createElement("section");
    col.className = "col";
    col.dataset.status = status;
    col.innerHTML = `<h2>${LABEL[status]}<span>${byStatus[status].length}</span></h2><div class="stack"></div>`;
    const stack = col.querySelector(".stack");
    byStatus[status].forEach(n => {
      const el = noteEl(n, { withStatusSelect: false });
      makeColumnDraggable(el, n);
      stack.appendChild(el);
    });
    boardEl.appendChild(col);
  });
};

const makeColumnDraggable = (el, n) => {
  el.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest("button, select")) return;
    ev.preventDefault();
    const rect = el.getBoundingClientRect();
    const dx = ev.clientX - rect.left, dy = ev.clientY - rect.top;
    const w = rect.width;
    let target = null;

    // The column rectangles are captured once, at the start of the drag, and the
    // target column comes out of a coordinate comparison — not out of
    // `document.elementFromPoint`. That avoids depending on how hit-testing
    // behaves underneath `setPointerCapture`, which is where the first version of
    // this failed silently.
    const colRects = [...document.querySelectorAll(".col")].map(c => ({
      el: c, status: c.dataset.status, r: c.getBoundingClientRect(),
    }));
    const columnAt = (x, y) =>
      colRects.find(({ r }) => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) || null;

    el.setPointerCapture(ev.pointerId);
    el.classList.add("dragging");
    Object.assign(el.style, {
      position: "fixed", width: w + "px", zIndex: "100",
      left: rect.left + "px", top: rect.top + "px",
    });

    const move = (e) => {
      el.style.left = (e.clientX - dx) + "px";
      el.style.top = (e.clientY - dy) + "px";
      const hit = columnAt(e.clientX, e.clientY);
      if (hit?.el !== target?.el) {
        target?.el.classList.remove("over");
        target = hit;
        target?.el.classList.add("over");
      }
    };

    const up = async () => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      target?.el.classList.remove("over");
      const next = target?.status;
      if (next && next !== n.status) {
        await api("POST", `/notes/${n.id}/status`, { status: next });
      }
      await load();   // reloads either way: it undoes the inline style
    };

    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
  });
};

// ── Filters ────────────────────────────────────────────────────────────────
/** Repopulate the tag selector with what actually exists in the notes.
 *
 * Only the tags present get in: a selector with nine options, seven of which
 * match nothing, is worse than no selector. The axis tags stay out because they
 * have selectors of their own.
 */
const populateTags = () => {
  const present = [...new Set(allNotes.flatMap(n => n.tags || []))]
    .filter(x => !AXIS_TAGS.includes(x))     // area and type have their own selector
    .sort();
  // Keep a selection that is no longer present, so the filter does not vanish
  // silently underneath the user while they are reading the screen.
  if (fTagV && !present.includes(fTagV)) present.push(fTagV);

  // Built through the DOM, not through innerHTML: a tag is user text, and the
  // "never innerHTML for user input" rule holds here as it does on the post-it.
  fTag.replaceChildren();
  fTag.add(new Option(tr("board.filter.tag"), ""));
  present.forEach(x => fTag.add(new Option(`#${x}`, x)));
  fTag.value = fTagV;
  fTag.disabled = present.length === 0;
};

const applyFilters = () => {
  notes = allNotes.filter(n => {
    const tags = n.tags || [];
    return [fAreaV, fTypeV, fTagV].every(f => !f || tags.includes(f));
  });
  populateTags();
  [[fArea, fAreaV], [fType, fTypeV], [fTag, fTagV]].forEach(([el, v]) => {
    el.value = v;
    el.classList.toggle("active", !!v);
  });
  render();
};

// The second element is the `localStorage` suffix, which stays Portuguese for the
// reason given where the three values are read.
const FILTERS = [[fArea, "eixo"], [fType, "tipo"], [fTag, "tag"]];

FILTERS.forEach(([el, key]) => {
  el.addEventListener("change", () => {
    if (key === "eixo") fAreaV = el.value;
    else if (key === "tipo") fTypeV = el.value;
    else fTagV = el.value;
    localStorage.setItem(`ta.filtro.${key}`, el.value);
    applyFilters();
  });
});

const clearFilters = () => {
  fAreaV = fTypeV = fTagV = "";
  FILTERS.forEach(([, key]) => localStorage.removeItem(`ta.filtro.${key}`));
  applyFilters();
};

// ── Review all ─────────────────────────────────────────────────────────────
// Double-check by button, not by `confirm()`: a modal browser dialog would freeze
// the page and cannot be automated in a test. Here the first click arms it, and it
// disarms itself after a few seconds if you change your mind.
let armedUntil = 0;
// 6s, not 4: you click, you READ "confirm? review all", and you decide. Four
// seconds disarmed before people finished reading.
const RESET_ARMED_MS = 6000;

const disarm = () => {
  btnReview.dataset.armed = "0";
  btnReview.textContent = tr("board.review");
  armedUntil = 0;
};

btnReview.addEventListener("click", async () => {
  if (Date.now() > armedUntil) {
    btnReview.dataset.armed = "1";
    btnReview.textContent = tr("board.confirm") + " " + tr("board.review");
    armedUntil = Date.now() + RESET_ARMED_MS;
    setTimeout(() => { if (Date.now() > armedUntil) disarm(); }, RESET_ARMED_MS + 50);
    return;
  }

  disarm();
  btnReview.disabled = true;
  btnReview.textContent = tr("board.queueing");
  try {
    const r = await api("POST", "/review-all");
    btnReview.textContent = trf("board.queued", { n: r.queued });
    followReview();
  } catch (e) {
    btnReview.textContent = tr("board.failed");
    warn(e.message);
    setTimeout(() => { btnReview.disabled = false; disarm(); }, 2500);
  }
});

/** Follow the queue as it drains, and reload when it is done. */
const followReview = async () => {
  for (let i = 0; i < 240; i++) {          // a ~8 min ceiling, not an endless loop
    await new Promise(r => setTimeout(r, 2000));
    let s;
    try { s = await api("GET", "/review-status"); } catch { break; }
    btnReview.textContent = s.pending ? `${s.pending}…` : tr("board.review");
    await load();
    if (!s.pending && !s.running) break;
  }
  btnReview.disabled = false;
  disarm();
};

// ── Empty the trash ────────────────────────────────────────────────────────
// Double-check like the other two destructive actions, and with a longer window:
// this is the only one in the app with no way back.
let purgeArmedUntil = 0;
const RESET_PURGE_MS = 8000;

const disarmPurge = () => {
  btnEmptyTrash.dataset.armed = "0";
  btnEmptyTrash.textContent = tr("board.empty_trash");
  purgeArmedUntil = 0;
};

btnEmptyTrash.addEventListener("click", async () => {
  if (Date.now() > purgeArmedUntil) {
    btnEmptyTrash.dataset.armed = "1";
    btnEmptyTrash.textContent = trf("board.purge_confirm", { n: allNotes.length });
    purgeArmedUntil = Date.now() + RESET_PURGE_MS;
    setTimeout(() => { if (Date.now() > purgeArmedUntil) disarmPurge(); },
               RESET_PURGE_MS + 50);
    return;
  }
  disarmPurge();
  btnEmptyTrash.disabled = true;
  try {
    const r = await api("DELETE", "/trash", { confirmed: true });
    btnEmptyTrash.textContent = trf("board.purged", { n: r.purged });
    await load();
  } catch (e) {
    btnEmptyTrash.textContent = tr("board.failed");
    // The reason goes to the screen, not just to the console: you are the one who
    // clicked.
    warn(e.message);
  }
  setTimeout(() => { btnEmptyTrash.disabled = false; disarmPurge(); }, 2000);
});

// ── Auto-refresh ───────────────────────────────────────────────────────────
// The review changes the note a few seconds after capture, and without this the
// board showed the regex's result until you hit F5.
const REFRESH_MS = 15000;

setInterval(() => {
  // Never reload mid-gesture or mid-typing: reloading rebuilds the DOM and would
  // drop the drag or wipe out what is being written.
  if (document.hidden) return;
  if (document.querySelector(".note.dragging")) return;
  if (document.activeElement === capture && capture.value.trim()) return;
  if (btnReview.disabled) return;          // `followReview` already reloads
  load().catch(() => {});                  // a network failure must not litter the screen
}, REFRESH_MS);

// ── Render ─────────────────────────────────────────────────────────────────
const draw = () => {
  boardEl.className = view;
  document.body.className = "view-" + view + (trash ? " trash" : "");
  boardTitleEl.textContent = tr("board.title");
  if (trash) boardTitleEl.insertAdjacentHTML("beforeend",
    `<span class="suffix"> \u00b7 ${tr("board.trash")}</span>`);
  boardEl.innerHTML = "";
  // Only the free-form view hides the finished notes, so only it gets the
  // checkbox. This read `view === "geral"` after the views were renamed, which
  // silently hid the toggle in every view.
  doneToggle.style.display = (view === "board" && !trash) ? "" : "none";
  btnReview.style.display = trash ? "none" : "";
  // Only shows up in the trash, and only when there is something to empty.
  btnEmptyTrash.hidden = !trash || !allNotes.length;
  // Capturing inside the trash would create a note you could not see: it is born
  // alive, and this screen only shows deleted ones.
  capture.disabled = trash;
  capture.placeholder = trash
    ? tr("board.in_trash")
    : tr("board.capture");
  const filtering = fAreaV || fTypeV || fTagV;
  countEl.textContent = notes.length
    ? (filtering ? `${notes.length} / ${allNotes.length}` : `${notes.length} ${tr("board.counter")}`)
    : "";
  [...viewsEl.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));

  if (!notes.length && trash) {
    // The em dash separates the two sentences: without it they ran together and
    // the screen said "the trash is emptyback to the board".
    boardEl.innerHTML = `<div class="empty">${tr("board.trash_empty")} — `
      + `<a href="#">${tr("board.back_to_board")}</a></div>`;
    return;
  }
  if (!notes.length) {
    // The message has to say WHICH of the two empties this one is.
    boardEl.innerHTML = allNotes.length
      ? `<div class="empty">${tr("board.no_match")} <button id="clear">${tr("board.clear_filters")}</button></div>`
      : `<div class="empty">${trf("board.empty", { cmd: "<code>ta note</code>" })}</div>`;
    const clear = document.getElementById("clear");
    if (clear) clear.onclick = clearFilters;
    return;
  }
  ({ board: renderBoard, list: renderList, kanban: renderKanban })[view]();
};

/** `draw` has three exits that write `boardEl.innerHTML` on their own (empty
 * trash, no notes, and the normal drawing). The notice goes in after all of them,
 * in one single place — and no caller of `render` has to change.
 *
 * Never throw here: `load` is called from seven places and three have no `catch`,
 * so a `throw` would become an unhandled rejection instead of a notice on screen.
 */
const render = () => {
  draw();
  warn(staleDaemon ? MSG_OUTDATED : null);
};

viewsEl.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  view = b.dataset.view;
  localStorage.setItem("ta.view", view);
  load();
});

capture.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter" || !capture.value.trim()) return;
  const text = capture.value;
  capture.value = "";
  try {
    await api("POST", "/notes", { text });
    await load();
  } catch (err) {
    capture.value = text;   // never swallow what the person wrote
    alert(tr("board.save_failed") + err.message);
  }
});

showDone.addEventListener("change", load);
load().catch(e => {
  // Through `#notice`, not through `innerHTML` on the board: the message can come
  // from the server (and `textContent` is what stops injection), and the
  // credential and stale-daemon ones are two lines long — `.error` has
  // `white-space: pre-line`.
  boardEl.innerHTML = `<div class="empty">${tr("board.load_failed")}</div>`;
  warn(e.message);
});
</script>
</body>
</html>
